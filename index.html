  <style>
    /* ── Color tokens ── */
    :root,
    [data-theme="dark"] {
      --c-bg: #0a0a0a;
      --c-bg-warm: #1a1410;
      --c-bg-mid: #0d0c0a;
      --c-text: #f5f0e8;
      --c-text-sub: #d4c8b8;
      --c-text-muted: #a89880;
      --c-text-dim: #6a5f52;
      --c-text-ghost: #5a4f42;
      --c-text-faint: #3a3028;
      --c-text-ultra: #2e2820;
      --c-accent: #c8a96e;
      --c-accent-dim: rgba(200, 169, 110, 0.25);
      --c-accent-faint: rgba(200, 169, 110, 0.08);
      --c-border: rgba(255, 255, 255, 0.06);
      --c-border-subtle: rgba(255, 255, 255, 0.03);
      --c-scrollbar: rgba(200, 169, 110, 0.2) transparent;
      --c-grain-opacity: 0.18;
    }

    [data-theme="light"] {
      --c-bg: #f0ebe0;
      --c-bg-warm: #e4ddd0;
      --c-bg-mid: #ece7dc;
      --c-text: #1a1208;
      --c-text-sub: #3a2e20;
      --c-text-muted: #6b5a42;
      --c-text-dim: #8a7a65;
      --c-text-ghost: #9a8c7a;
      --c-text-faint: #b0a492;
      --c-text-ultra: #c4baa8;
      --c-accent: #8b5a2b;
      --c-accent-dim: rgba(139, 90, 43, 0.22);
      --c-accent-faint: rgba(139, 90, 43, 0.07);
      --c-border: rgba(0, 0, 0, 0.07);
      --c-border-subtle: rgba(0, 0, 0, 0.04);
      --c-scrollbar: rgba(139, 90, 43, 0.2) transparent;
      --c-grain-opacity: 0.07;
    }

    /* Reset & base */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* Scene scrollable zones — thin accent scrollbar */
    .film-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--c-scrollbar);
    }

    .film-scroll::-webkit-scrollbar {
      width: 2px;
      background: transparent;
    }

    .film-scroll::-webkit-scrollbar-thumb {
      background: var(--c-accent-dim);
      border-radius: 2px;
    }

    /* Hide scrollbars on non-scrollable zones */
    ::-webkit-scrollbar {
      display: none;
    }

    * {
      scrollbar-width: none;
    }

    .film-scroll {
      scrollbar-width: thin;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
